{% extends "base.html" %}

{% block content %}

<h1>Nutzer</h1>

<ul class="user-list">
    {% for user in users %}
    <li class="user-entry">
        <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn">
            {{ user.name }}
        </a>
    </li>
    {% endfor %}
</ul>

<h2>Neuen Nutzer hinzufügen</h2>

<form action="{{ url_for('create_user') }}" method="post">
    <input type="text" name="name" placeholder="Name eingeben" required>
    <button type="submit">Hinzufügen</button>
</form>

{% endblock %}
