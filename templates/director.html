{% extends "base.html" %}

{% block content %}

<h1>Regisseur angeben</h1>

<p>Der Film <strong>{{ title }}</strong> ({{ year }}) ist noch nicht in der Datenbank.
Bitte gib den Regisseur ein.</p>

<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">
    <input type="hidden" name="title" value="{{ title }}">
    <input type="hidden" name="year" value="{{ year }}">
    <input type="text" name="director" placeholder="Regisseur eingeben" required autofocus>
    <button type="submit">Speichern</button>
</form>

<p><a href="{{ url_for('get_movies', user_id=user_id) }}">Abbrechen</a></p>

{% endblock %}
